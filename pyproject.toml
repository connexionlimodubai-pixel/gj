[project]
name = "openberry"
version = "0.1.1"
description = "Free, self-hosted, open-source alternative to Gojiberry: intent-signal lead generation driven by Claude via MCP, with a web dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# The desktop app's native window (`openberry desktop`). Without it the dashboard opens in the browser.
desktop = ["pywebview>=5"]

[project.scripts]
openberry = "openberry.cli:main"
openberry-desktop = "openberry.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openberry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
