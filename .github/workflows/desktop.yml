# Runs the tests on Windows, macOS and Linux, builds the OpenBerry desktop app on each, checks each build end to end
# (packaging/smoke_test.py) and keeps the downloads for 14 days. A pushed tag vX.Y.Z also publishes them as a GitHub
# Release: a draft first, with the three downloads, SHA256SUMS and the version's CHANGELOG.md section as its notes,
# published as the latest release once complete, and then the three .../releases/latest/download/... links are checked.
# See docs/DESKTOP.md ("Releasing").
# Every action is pinned to a commit (the comment names its version; Dependabot proposes updates) and runs on Node 24.
name: Desktop app

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    # Path filters are not applied to tag pushes: every vX.Y.Z tag builds a release.
    tags: ["v*"]
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            extras: --extra desktop
          - os: macos-latest # Apple silicon (arm64)
            name: macos
            extras: --extra desktop
          - os: ubuntu-latest
            name: linux
            extras: "" # no pywebview: the Linux app opens the dashboard in the browser
    defaults:
      run:
        shell: bash # Git Bash on Windows: one script for every runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install OpenBerry and PyInstaller
        # PyInstaller comes from uv.lock too (the "build" dependency group).
        run: uv sync --locked --extra dev ${{ matrix.extras }} --group build

      - name: Lint
        if: runner.os == 'Linux'
        run: uvx ruff@0.16.8 check src tests packaging

      - name: Install Chromium for the browser tests
        if: runner.os == 'Linux'
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Run the tests
        run: uv run --no-sync pytest -q

      - name: Build the app
        id: build
        env:
          # On a tag push, the build checks that the tag matches OpenBerry's version.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: uv run --no-sync python packaging/build.py --release-tag "$RELEASE_TAG"

      - name: Smoke-test the build
        env:
          CLI: ${{ steps.build.outputs.cli }}
          GUI: ${{ steps.build.outputs.gui }}
        run: uv run --no-sync python packaging/smoke_test.py "$CLI" "$GUI"

      - name: Keep the download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenBerry-${{ steps.build.outputs.version }}-${{ matrix.name }}
          path: ${{ steps.build.outputs.archive }}
          retention-days: 14
          compression-level: 0 # already a .zip or .tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        # The tag's section (## 0.2.0) becomes the release notes; GitHub adds the merged pull requests below it.
        # No section for this version: nothing is published.
        run: python3 packaging/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OpenBerry-*
          path: downloads
          merge-multiple: true

      - name: Check the downloads and write their checksums
        working-directory: downloads
        run: |
          for name in OpenBerry-windows-x64.zip OpenBerry-macos-arm64.zip OpenBerry-linux-x64.tar.gz; do
            test -s "$name" || { echo "::error::$name is missing"; exit 1; }
          done
          sha256sum OpenBerry-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release as a draft
        # A draft is invisible to "latest": the download links keep pointing at the previous release until this one
        # has every file. A draft an earlier run of this job left is replaced; a published release for this tag (one
        # made in GitHub's web page, say) stops the job: see docs/DESKTOP.md, "Releasing".
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" downloads/* --draft --verify-tag --title "OpenBerry $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes

      - name: Publish it as the latest release
        run: gh release edit "$TAG" --draft=false --latest

  check-downloads:
    name: Check the download links
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: The three latest-release links answer 200
        env:
          LATEST: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download
        run: |
          failed=0
          for name in OpenBerry-windows-x64.zip OpenBerry-macos-arm64.zip OpenBerry-linux-x64.tar.gz; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' "$LATEST/$name" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$name: $code"
            [ "$code" = 200 ] || { echo "::error::$LATEST/$name answered $code"; failed=1; }
          done
          exit $failed
