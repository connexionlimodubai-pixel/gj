[project]
name = "openberry"
version = "0.2.0"
description = "Free, self-hosted, open-source alternative to Gojiberry: intent-signal lead generation driven by Claude via MCP, with a web dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
# playwright and pillow: the browser tests and the icon tests (`uv run playwright install chromium` once).
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.45", "pillow>=10"]
# The desktop app's native window (`openberry desktop`). Without it the dashboard opens in the browser.
desktop = ["pywebview>=5"]

[dependency-groups]
# Building the desktop app (packaging/build.py), locked in uv.lock like the rest: `uv sync --group build`.
build = ["pyinstaller>=6.22,<7", "pyinstaller-hooks-contrib>=2026.8"]

[project.scripts]
openberry = "openberry.cli:main"
openberry-desktop = "openberry.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openberry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# Uses test_keep_scroll_browser's fixtures by importing them: pytest passes them in as same-named arguments.
"tests/test_email_browser.py" = ["F811"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
